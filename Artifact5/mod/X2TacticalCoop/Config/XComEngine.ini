; Tells the game to load the X2TacticalCoop script package at run time.
[Engine.ScriptPackages]
+NonNativePackages=X2TacticalCoop

; The mod's one class override. It only changes the follow camera while a co-op
; session runs; see X2TC_Action_CameraFollowUnit.
[Engine.Engine]
+ModClassOverrides=(BaseGameClass="X2Action_CameraFollowUnit", ModClass="X2TC_Action_CameraFollowUnit")
